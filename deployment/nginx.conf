# This file should be written into /etc/nginx/sites-enabled/<filename>

server {

    listen 80;
    # server_name cashtokens.studio;
    server_name 54.151.168.185;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
